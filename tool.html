<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool Page</title>
    <link rel="stylesheet" href="/css/tool.css" />
</head>
<body>

<!-- Hero Section -->
<section class="hero-section">
    <div class="hero-content">
        <h1 id="tool-title">Tool Name</h1>
        <p id="tool-tagline">Brief description of the tool.</p>
        <a href="#" class="btn" id="tool-cta">Book a Demo</a>
    </div>
    <div class="hero-icon">
        <img id="tool-icon" src="/images/logo.svg" alt="Tool Logo">
    </div>
</section>

<!-- The Problem -->
<section class="section">
    <h2 id="problem-title">The Problem</h2>
    <p id="tool-problem">Problem description will appear here.</p>
</section>

<!-- The Solution -->
<section class="section">
    <h2 id="solution-title">The Solution</h2>
    <p id="tool-solution">Solution content goes here.</p>
</section>

<!-- How It Works -->
<section class="section">
    <h2>How It Works</h2>
    <ul id="tool-steps"></ul>
</section>

<!-- Features -->
<section class="section">
    <h2>Top Features</h2>
    <div class="feature-grid" id="tool-features"></div>
</section>

<script src="/js/tool.js"></script>
</body>
</html>
